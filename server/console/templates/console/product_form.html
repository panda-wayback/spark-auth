{% extends "console/base.html" %}

{% block content %}
<h1>{{ title }}</h1>
<p class="sub"><a href="{% url 'console:products' %}">← 返回软件列表</a></p>
<div class="card form" style="max-width: 480px;">
  {% if product %}<p><label>标识</label><span class="mono">{{ product.code }}</span><span class="helptext">接入方软件激活时上报的软件标识；创建后不能修改</span></p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">保存</button>
  </form>
</div>
{% endblock %}

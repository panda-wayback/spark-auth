{% extends "console/base.html" %}

{% block content %}
<div class="card form" style="max-width: 360px; margin: 80px auto;">
  <h1>Spark Auth</h1>
  <p class="sub">首次使用，请创建管理员账号</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <p><label for="id_username">账号</label>{{ form.username }}{{ form.username.errors }}</p>
    <p><label for="id_password">密码</label>{{ form.password }}{{ form.password.errors }}</p>
    <p><label for="id_password_confirm">确认密码</label>{{ form.password_confirm }}{{ form.password_confirm.errors }}</p>
    <button class="primary" type="submit">创建并进入</button>
  </form>
</div>
{% endblock %}

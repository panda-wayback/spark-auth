<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spark Auth{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2328; background: #f6f7f9; }
    a { color: #0b63ce; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e3e5e8; }
    header .brand { font-weight: 600; font-size: 16px; color: #1f2328; }
    header nav { display: flex; gap: 16px; align-items: center; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #656d76; margin: 0 0 20px; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    .card { background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 14px; margin: 0 0 10px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; overflow: hidden; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eef0f2; }
    td.mono { font-size: 13px; }
    .scroll { overflow-x: auto; }
    .nowrap { white-space: nowrap; }
    .actions { display: grid; grid-template-columns: 90px 1fr; gap: 12px 16px; align-items: center; }
    .actions form, .actions div { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0; }
    th { background: #fafbfc; color: #656d76; font-weight: 500; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .muted { color: #8b949e; }
    input[type=text], input[type=password], input[type=number], input[type=search], select { padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
    input[type=number] { width: 80px; }
    button, .btn { display: inline-block; padding: 6px 14px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; color: #1f2328; font: inherit; cursor: pointer; }
    .btn:hover { text-decoration: none; }
    button.primary, .btn.primary { background: #0b63ce; border-color: #0b63ce; color: #fff; }
    button.link { border: 0; background: none; padding: 0; color: #0b63ce; }
    .inline { display: inline; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; background: #e8f3ff; }
    .msg.error { background: #ffebe9; }
    .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #eef0f2; }
    .tag.有效, .tag.使用中 { background: #dafbe1; }
    .tag.已到期, .tag.已禁用, .tag.已用完 { background: #ffebe9; }
    .form p { margin: 0 0 12px; }
    .form label { display: block; margin-bottom: 4px; color: #656d76; }
    .helptext { display: block; flex-basis: 100%; color: #8b949e; font-size: 12px; }
    .errorlist { color: #cf222e; margin: 4px 0; padding: 0; list-style: none; }
    textarea { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; }
    .pager { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <a class="brand" href="{% url 'console:products' %}">Spark Auth</a>
    <nav>
      <a href="{% url 'console:mcp_setup' %}">MCP 接入</a>
      <a href="{% url 'console:password' %}">修改密码</a>
      <form class="inline" method="post" action="{% url 'console:logout' %}">{% csrf_token %}<button class="link">退出</button></form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% for message in messages %}
      <div class="msg {% if message.level_tag == 'error' %}error{% endif %}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

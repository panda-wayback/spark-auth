name: console
function: 极简管理后台：登录、软件列表、软件的 key 页、key 详情
modules: []
input:
  - name: 管理员操作
    type: 网页表单 / 上传文件
    desc: 登录、新建与编辑软件、生成 key、导入 CSV、导出、禁用与取消禁用 key
output:
  - name: 管理页面
    type: HTML
    desc: 登录页、软件列表、软件的 key 页、key 详情页、生成或导入结果页
  - name: 导出文件
    type: CSV 下载
    desc: 由 server/keys 生成
contract:
  - 不使用 Django 自带后台；不提供用户、组管理页面
  - 只有超级管理员可访问；未登录访问任何页面跳转登录页
  - 登录状态 12 小时有效；可退出、可修改密码
  - 连续 5 次登录失败，暂停登录 15 分钟；密码只保存哈希值
  - 软件列表展示名称、标识、换设备策略、key 数量、状态；可新建、编辑（名称、换设备策略、禁用），标识创建后不可改
  - key 页只作用于当前软件：生成（数量 + 有效天数）、导入 CSV（文件 + 有效天数）、导出 CSV、按 key 搜索、分页
  - key 列表展示 key、状态、有效时长、到期时间、当前设备、换设备次数；每行可禁用或取消禁用
  - 生成成功后列出本批 key；导入重复时列出重复 key
  - key 详情页只读展示当前激活记录与全部换设备记录
  - 软件与 key 不提供删除；激活记录与换设备记录不提供新增、修改、删除
  - 生成与导入规则全部由 server/keys 执行
depends:
  - server/keys
errors:
  - code: LOGIN_FAILED
    desc: 账号或密码错误
  - code: LOGIN_LOCKED
    desc: 连续失败达到上限，登录暂停 15 分钟
tests:
  - 未登录访问任何页面跳转登录页；非超级管理员无法访问
  - 连续 5 次错误密码后，正确密码也被拒绝
  - 新建软件后出现在列表；编辑时标识不可改
  - key 页生成、导入、导出只作用于当前软件
  - 生成超过上限显示错误；导入重复显示重复项且库中无新增
  - 禁用与取消禁用切换 key 状态
  - key 详情页展示记录且无修改入口

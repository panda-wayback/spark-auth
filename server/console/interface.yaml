name: console
function: 极简管理后台：登录、软件列表、软件的卡密页（含卡密测试窗口）、卡密批次列表、激活详情、核销详情、MCP 接入
modules: []
input:
  - name: /setup/
    type: 无管理员时 GET 引导页、POST {username, password, password_confirm}；有管理员时一律跳转登录页
    desc: 首次初始化，创建唯一超级管理员并自动登录
  - name: 系统无管理员时的任意请求
    type: 重定向到 /setup/
    desc: 未初始化期间除初始化页与 /healthz 外的所有请求（含登录页、客户端接口与 MCP）
  - name: /login/、/logout/、/password/
    type: 网页表单
    desc: 登录、退出、修改密码
  - name: /、/products/new/、/products/<id>/edit/
    type: 网页表单；新建 {code, name, kind, allow_transfer, transfer_penalty_hours}，编辑设备激活软件 {name, allow_transfer, transfer_penalty_hours, disabled}，编辑按次数软件 {name, disabled}
    desc: 软件列表、新建软件、编辑软件
  - name: /products/<id>/delete/
    type: POST
    desc: 删除软件；成功或被拒绝都跳转软件列表并显示提示
  - name: /products/<id>/、/products/<id>/issue/、/products/<id>/export/
    type: 卡密页 GET ?q=&page=；签发 POST：设备激活软件 {count, duration_days}，按次数软件 {count, uses}；导出 GET ?batch=<批次标识>（省略则导出全部批次）
    desc: 当前软件的已激活记录或核销记录、批量签发、导出 CSV
  - name: /products/<id>/batches/、/batches/<批次标识>/disable/
    type: 列表 GET；禁用 POST
    desc: 卡密批次列表与禁用
  - name: /activations/<id>/、/activations/<id>/toggle/
    type: 详情 GET；切换 POST {next?}
    desc: 激活详情；禁用或取消禁用激活记录
  - name: /redemptions/<卡密>/
    type: GET；卡密为标准卡密
    desc: 按次数卡密的核销详情
  - name: /mcp-setup/
    type: GET
    desc: MCP 接入页
output:
  - name: 上述网页路由
    type: HTML
    desc: 初始化引导页、登录页、软件列表、卡密页、卡密批次列表、激活详情页、核销详情页、签发结果页、MCP 接入页；软件、批次、激活记录不存在或卡密没有核销记录时 404
  - name: /products/<id>/export/
    type: CSV 下载（UTF-8 带 BOM）
    desc: 内容由 server/keys 生成；批次不属于当前软件时 404
contract:
  - 不使用 Django 自带后台；不提供用户、组管理页面
  - 系统无管理员时为未初始化状态：除 /setup/ 与 /healthz 外的所有请求（含登录页、客户端接口、MCP）重定向到 /setup/；已有管理员时该状态结束，再访问 /setup/ 重定向到登录页
  - 初始化页提交后创建超级管理员并自动登录，跳转到软件列表；两次密码不一致或用户名为空时留在本页显示错误
  - 只有超级管理员可访问业务页面；已初始化且未登录时访问跳转登录页
  - 登录状态 12 小时有效；可退出、可修改密码
  - 连续 5 次登录失败，暂停登录 15 分钟；密码只保存哈希值
  - 软件列表展示名称、标识、类型、换设备策略（按次数软件不展示）、已使用数量（设备激活软件为激活记录数，按次数软件为核销记录数）、状态；可新建（选择类型）、编辑（名称、换设备策略、禁用；按次数软件只有名称与禁用），标识与类型创建后不可改
  - 卡密页只作用于当前软件：批量签发（设备激活软件填数量 + 有效天数；按次数软件填数量 + 可用次数）、导出 CSV、分页；设备激活软件搜索已激活记录，按次数软件搜索核销记录
  - 已激活记录列表展示卡密、状态、有效时长、到期时间、当前设备、换设备次数；每行可禁用或取消禁用
  - 核销记录列表按卡密汇总，每个卡密一行，只读展示卡密、状态（使用中 / 已用完）、已用 / 可用次数、首次与最近核销时间；搜索、分页与总数都按卡密计；点卡密进入核销详情
  - 核销详情页只读展示卡密、状态、已用 / 可用次数与每一次核销（第几次、核销时间、核销 IP）；IP 为空显示 -
  - 卡密页有卡密测试窗口，由浏览器直接请求客户端接口，原样显示 HTTP 状态与返回内容：设备激活软件填卡密与设备名，「激活」调用 POST /api/activate（device_hash = sha256(设备名) 的十六进制，device_info = 设备名，成功后自动填入 token），「校验」调用 POST /api/verify；按次数软件填卡密，「核销」调用 POST /api/redeem；测试即真实调用，产生的记录与接入方调用相同
  - 卡密批次列表展示批次标识、生成时间、生成数量、有效时长（设备激活软件）或可用次数（按次数软件）、状态；每行可禁用
  - 签发成功后列出本批卡密
  - 激活详情页只读展示当前激活记录（含激活 IP）与全部换设备记录（含新设备 IP）；IP 为空显示 -
  - MCP 接入页展示 mcp.json，其中 url 为当前访问地址 + /mcp；提供复制按钮
  - 不校验访问地址，不再提供访问地址页；任意域名或 IP 的请求都按登录状态决定能否访问管理页面
  - 不在使用中的软件可以删除；使用中指设备激活软件有未禁用且未到期的激活记录（server/activation 的 count_in_use_by_product），或按次数软件有已核销但次数未用完的卡密（server/redeem 的 count_in_use_by_product）
  - 列表只对可删除的软件显示删除按钮，点击后弹窗确认；对使用中的软件提交删除被拒绝且不改动；删除在同一事务内清除其激活记录、换设备记录、核销记录与卡密批次，标识可重新使用
  - 激活记录、换设备记录与核销记录不提供新增、修改、删除；卡密批次不提供单独删除
  - 不直接读写数据表：软件、批次、签发、导出与删除经 server/keys，激活记录查询、详情、禁用与删除及测试窗口的激活、校验经 server/activation，核销记录汇总、详情、删除及测试窗口的核销经 server/redeem；新建与编辑软件的校验规则与错误信息来自 server/keys
depends:
  - server/keys
  - server/activation
  - server/redeem
errors:
  - code: LOGIN_FAILED
    desc: 账号或密码错误
  - code: LOGIN_LOCKED
    desc: 连续失败达到上限，登录暂停 15 分钟
tests:
  - 无管理员时访问任意页面（含登录页、客户端接口、MCP）跳转初始化页，/healthz 不跳转；初始化页可正常打开
  - 初始化页创建管理员并自动登录进入软件列表；两次密码不一致或用户名为空时留在本页报错
  - 已有管理员后访问初始化页跳转登录页；业务页面未登录访问跳转登录页；非超级管理员无法访问
  - 连续 5 次错误密码后，正确密码也被拒绝
  - 新建软件后出现在列表；标识重复或格式错误时显示错误；编辑时标识不可改
  - 没有记录、激活全部到期或被禁用、核销过的卡密次数全部用完的软件可删除，删除后从列表消失、记录一并清除、标识可再次新建
  - 有使用中激活或有次数未用完的已核销卡密的软件不显示删除按钮，直接提交删除被拒绝且软件仍在
  - 新建按次数软件后，卡密页填数量与可用次数即可签发，批次列表显示可用次数；页面按卡密汇总展示核销记录（已用 / 可用、状态）且可按卡密搜索；编辑页没有换设备策略
  - 核销详情页展示该卡密每一次核销且无修改入口；没有核销记录的卡密返回 404
  - 卡密页批量签发、导出只作用于当前软件
  - 设备激活软件的卡密页测试窗口有激活与校验（/api/activate、/api/verify），按次数软件的有核销（/api/redeem）
  - 签发超过上限显示错误
  - 禁用与取消禁用切换激活记录状态
  - 卡密批次禁用后状态变为已禁用且不再显示禁用入口
  - 激活详情页展示记录且无修改入口；不存在的记录返回 404
  - MCP 接入页的 url 随访问域名变化

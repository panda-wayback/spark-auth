name: console
function: 极简管理后台：登录、软件列表、软件的卡密页、私钥批次列表、激活详情、访问地址、MCP 接入；访问地址校验
modules: []
input:
  - name: /login/、/logout/、/password/
    type: 网页表单
    desc: 登录、退出、修改密码
  - name: /、/products/new/、/products/<id>/edit/
    type: 网页表单；新建 {code, name, allow_transfer, transfer_penalty_hours}，编辑 {name, allow_transfer, transfer_penalty_hours, disabled}
    desc: 软件列表、新建软件、编辑软件
  - name: /products/<id>/、/products/<id>/issue/、/products/<id>/export/
    type: 卡密页 GET ?q=&page=；签发 POST {count, duration_days}；导出 GET ?batch=<批次标识>（省略则导出全部批次）
    desc: 当前软件的已激活记录、批量签发、导出 CSV
  - name: /products/<id>/signing-keys/、/signing-keys/<id>/disable/
    type: 列表 GET；禁用 POST
    desc: 私钥批次列表与禁用
  - name: /activations/<id>/、/activations/<id>/toggle/
    type: 详情 GET；切换 POST {next?}
    desc: 激活详情；禁用或取消禁用激活记录
  - name: /hosts/、/hosts/delete/
    type: 列表 GET ?detect=1（检测公网 IP）；添加 POST {host}；删除 POST {host}
    desc: 访问地址管理
  - name: /mcp-setup/
    type: GET
    desc: MCP 接入页
  - name: 任意请求的 Host
    type: 域名或 IP
    desc: 访问地址校验，对全站生效
output:
  - name: 上述网页路由
    type: HTML
    desc: 登录页、软件列表、卡密页、私钥批次列表、激活详情页、签发结果页、访问地址页、MCP 接入页
  - name: /products/<id>/export/
    type: CSV 下载（UTF-8 带 BOM）
    desc: 内容由 server/keys 生成
  - name: 未允许的 Host
    type: 400 纯文本
    desc: 提示该地址未被允许
contract:
  - 不使用 Django 自带后台；不提供用户、组管理页面
  - 只有超级管理员可访问；未登录访问任何页面跳转登录页
  - 登录状态 12 小时有效；可退出、可修改密码
  - 连续 5 次登录失败，暂停登录 15 分钟；密码只保存哈希值
  - 软件列表展示名称、标识、换设备策略、已激活数量、状态；可新建、编辑（名称、换设备策略、禁用），标识创建后不可改
  - 卡密页只作用于当前软件：批量签发（数量 + 有效天数）、导出 CSV、搜索已激活记录、分页
  - 已激活记录列表展示卡密、状态、有效时长、到期时间、当前设备、换设备次数；每行可禁用或取消禁用
  - 私钥批次列表展示批次标识、生成时间、生成数量、有效时长、状态；每行可禁用
  - 签发成功后列出本批卡密
  - 激活详情页只读展示当前激活记录与全部换设备记录
  - MCP 接入页展示 mcp.json，其中 url 为当前访问地址 + /mcp；提供复制按钮
  - 访问地址 = 内置 localhost、127.0.0.1（只读）+ server/allowed_hosts.txt（一行一个，# 开头为注释，纳入 git）；不在其中的请求一律返回 400，对全站生效
  - 每次请求读取 server/allowed_hosts.txt；后台增删写回该文件，手动编辑文件同样立即生效
  - 访问地址页列出两类地址；候选地址为服务器局域网 IP（已允许的不再列出），可一键添加；其它地址手动填写
  - 地址只填域名或 IP，不含端口与协议；保存时转小写；前导点表示含全部子域名
  - 后台添加的地址可删除；当前请求所用的地址不能删除；增删立即生效
  - 检测公网 IP：仅在管理员点击时由服务器请求 https://api.ipify.org，超时 5 秒；返回合法 IPv4 时作为候选地址展示（已允许则提示已在列表中）
  - 软件不提供删除；激活记录与换设备记录不提供新增、修改、删除；私钥批次不提供删除
  - 签发与导出规则全部由 server/keys 执行
depends:
  - server/keys
errors:
  - code: LOGIN_FAILED
    desc: 账号或密码错误
  - code: LOGIN_LOCKED
    desc: 连续失败达到上限，登录暂停 15 分钟
  - code: HOST_INVALID
    desc: 访问地址格式错误或已存在
  - code: HOST_IN_USE
    desc: 当前正在使用的访问地址不能删除
  - code: PUBLIC_IP_UNAVAILABLE
    desc: 检测公网 IP 失败（网络错误、超时或返回内容不是 IPv4）
tests:
  - 未登录访问任何页面跳转登录页；非超级管理员无法访问
  - 连续 5 次错误密码后，正确密码也被拒绝
  - 新建软件后出现在列表；编辑时标识不可改
  - 卡密页批量签发、导出只作用于当前软件
  - 签发超过上限显示错误
  - 禁用与取消禁用切换激活记录状态
  - 私钥批次禁用后，同批次未激活卡密不能首次激活
  - 激活详情页展示记录且无修改入口
  - MCP 接入页的 url 随访问域名变化
  - 未允许的地址访问返回 400；在访问地址页添加后立即可访问，删除后立即被拒绝
  - 访问地址格式错误或重复时显示错误；当前使用的地址不能删除
  - 检测公网 IP 成功时展示一键添加按钮；失败时显示错误；未点击检测时不访问外网

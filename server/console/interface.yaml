name: console
function: 极简管理后台：登录、软件列表、软件的卡密页、卡密批次列表、激活详情、MCP 接入
modules: []
input:
  - name: /setup/
    type: 无管理员时 GET 引导页、POST {username, password, password_confirm}；有管理员时一律跳转登录页
    desc: 首次初始化，创建唯一超级管理员并自动登录
  - name: 系统无管理员时的任意请求
    type: 重定向到 /setup/
    desc: 未初始化期间除初始化页外的所有请求（含登录页、客户端接口与 MCP）
  - name: /login/、/logout/、/password/
    type: 网页表单
    desc: 登录、退出、修改密码
  - name: /、/products/new/、/products/<id>/edit/
    type: 网页表单；新建 {code, name, allow_transfer, transfer_penalty_hours}，编辑 {name, allow_transfer, transfer_penalty_hours, disabled}
    desc: 软件列表、新建软件、编辑软件
  - name: /products/<id>/、/products/<id>/issue/、/products/<id>/export/
    type: 卡密页 GET ?q=&page=；签发 POST {count, duration_days}；导出 GET ?batch=<批次标识>（省略则导出全部批次）
    desc: 当前软件的已激活记录、批量签发、导出 CSV
  - name: /products/<id>/batches/、/batches/<批次标识>/disable/
    type: 列表 GET；禁用 POST
    desc: 卡密批次列表与禁用
  - name: /activations/<id>/、/activations/<id>/toggle/
    type: 详情 GET；切换 POST {next?}
    desc: 激活详情；禁用或取消禁用激活记录
  - name: /mcp-setup/
    type: GET
    desc: MCP 接入页
output:
  - name: 上述网页路由
    type: HTML
    desc: 初始化引导页、登录页、软件列表、卡密页、卡密批次列表、激活详情页、签发结果页、MCP 接入页；软件、批次、激活记录不存在时 404
  - name: /products/<id>/export/
    type: CSV 下载（UTF-8 带 BOM）
    desc: 内容由 server/keys 生成；批次不属于当前软件时 404
contract:
  - 不使用 Django 自带后台；不提供用户、组管理页面
  - 系统无管理员时为未初始化状态：除 /setup/ 外的所有请求（含登录页、客户端接口、MCP）重定向到 /setup/；已有管理员时该状态结束，再访问 /setup/ 重定向到登录页
  - 初始化页提交后创建超级管理员并自动登录，跳转到软件列表；两次密码不一致或用户名为空时留在本页显示错误
  - 只有超级管理员可访问业务页面；已初始化且未登录时访问跳转登录页
  - 登录状态 12 小时有效；可退出、可修改密码
  - 连续 5 次登录失败，暂停登录 15 分钟；密码只保存哈希值
  - 软件列表展示名称、标识、换设备策略、已激活数量、状态；可新建、编辑（名称、换设备策略、禁用），标识创建后不可改
  - 卡密页只作用于当前软件：批量签发（数量 + 有效天数）、导出 CSV、搜索已激活记录、分页
  - 已激活记录列表展示卡密、状态、有效时长、到期时间、当前设备、换设备次数；每行可禁用或取消禁用
  - 卡密批次列表展示批次标识、生成时间、生成数量、有效时长、状态；每行可禁用
  - 签发成功后列出本批卡密
  - 激活详情页只读展示当前激活记录与全部换设备记录
  - MCP 接入页展示 mcp.json，其中 url 为当前访问地址 + /mcp；提供复制按钮
  - 不校验访问地址，不再提供访问地址页；任意域名或 IP 的请求都按登录状态决定能否访问管理页面
  - 软件不提供删除；激活记录与换设备记录不提供新增、修改、删除；卡密批次不提供删除
  - 不直接读写数据表：软件、批次、签发与导出经 server/keys，激活记录查询、详情与禁用经 server/activation；新建与编辑软件的校验规则与错误信息来自 server/keys
depends:
  - server/keys
  - server/activation
errors:
  - code: LOGIN_FAILED
    desc: 账号或密码错误
  - code: LOGIN_LOCKED
    desc: 连续失败达到上限，登录暂停 15 分钟
tests:
  - 无管理员时访问任意页面（含登录页、客户端接口、MCP）跳转初始化页；初始化页可正常打开
  - 初始化页创建管理员并自动登录进入软件列表；两次密码不一致或用户名为空时留在本页报错
  - 已有管理员后访问初始化页跳转登录页；业务页面未登录访问跳转登录页；非超级管理员无法访问
  - 连续 5 次错误密码后，正确密码也被拒绝
  - 新建软件后出现在列表；标识重复或格式错误时显示错误；编辑时标识不可改
  - 卡密页批量签发、导出只作用于当前软件
  - 签发超过上限显示错误
  - 禁用与取消禁用切换激活记录状态
  - 卡密批次禁用后状态变为已禁用且不再显示禁用入口
  - 激活详情页展示记录且无修改入口；不存在的记录返回 404
  - MCP 接入页的 url 随访问域名变化

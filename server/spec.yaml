name: server
function: Django 服务端：product 与私钥批次、卡密激活与校验、管理后台
modules:
  - path: keys
    function: 数据表（product、私钥批次、激活记录、换设备记录）与卡密签发、导出
  - path: activation
    function: 卡密签名验证、激活判定、计时与换设备扣减、token 签发与校验、客户端接口
  - path: console
    function: 极简管理后台：登录、软件列表、软件的卡密页、私钥批次列表、激活详情
input: []
output: []
contract:
  - 所有数据存储在单个 SQLite 数据库
  - 客户端接口无需登录；所有管理操作只能在登录后台后进行
  - Django 项目配置与网址路由位于 server 根目录，不单独成模块
depends: []
errors: []
tests:
  - 组合测试：在 console 创建 product 与签发卡密后，activation 可完成激活与校验
  - 组合测试：activation 换设备后，console 的激活详情页显示新增的换设备记录
  - 组合测试：在 console 禁用私钥批次后，同批次未激活卡密首次激活被拒绝，已激活记录仍可校验

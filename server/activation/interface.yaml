name: activation
function: 激活记录与换设备记录的数据、激活判定、计时与换设备扣减、token 签发与校验、客户端接口、后台查询与禁用、只读 MCP 接入说明
modules: []
input:
  - name: POST /api/activate
    type: JSON {code, device_hash, device_info?}
    desc: code 为用户输入的卡密，可带空白与连字符，大小写不限，product 由卡密所属批次在服务端确定；device_hash 为 64 位小写十六进制设备指纹哈希；device_info 为可选的可读设备信息，不超过 255 个字符
  - name: POST /api/verify
    type: JSON {device_hash, token}
    desc: token 为激活时签发的 token，product 由 token 携带
  - name: POST /mcp
    type: JSON-RPC 2.0 消息
    desc: MCP Streamable HTTP（无状态）；方法 initialize、ping、tools/list、tools/call
  - name: activation.services.count_by_product
    type: ()
    desc: 统计各 product 的激活记录数
  - name: activation.services.search
    type: (product_code, query="")
    desc: 列出 product 的激活记录，新记录在前；query 非空时按卡密（忽略空白、连字符与大小写）、设备信息或设备指纹模糊匹配
  - name: activation.services.get_detail
    type: (activation_id)；int
    desc: 取激活记录与它的全部换设备记录
  - name: activation.services.toggle_disabled
    type: (activation_id)；int
    desc: 禁用或取消禁用激活记录
  - name: activation.services.count_in_use_by_product
    type: ()
    desc: 统计各 product 使用中（未禁用且未到期）的激活记录数
  - name: activation.services.delete_by_product
    type: (product_code)；str
    desc: 删除 product 的全部激活记录与换设备记录，供删除 product 时调用
output:
  - name: POST /api/activate
    type: JSON {ok:true, token, expires_at}
    desc: token 绑定 product、code、device_hash；expires_at 为 ISO 8601 到期时间
  - name: POST /api/verify
    type: JSON {ok:true, valid:true, expires_at}
    desc: expires_at 为 ISO 8601 到期时间
  - name: POST /api/activate、POST /api/verify 失败
    type: JSON {ok:false, error:{code, message}}
    desc: REQUEST_INVALID 为 400，其余为 403
  - name: POST /mcp
    type: JSON-RPC 2.0 响应
    desc: 直接返回 JSON；通知返回 202
  - name: activation.services.count_by_product
    type: dict[str, int]
    desc: product 标识 → 激活记录数；没有激活记录的 product 不出现
  - name: activation.services.search
    type: list[ActivationInfo]
    desc: ActivationInfo 字段 id、code（标准卡密）、product_code、device_hash、device_info、ip（激活 IP，旧记录为 None）、duration_days、expires_at、disabled、activated_at、transfer_count、status（有效 / 已到期 / 已禁用）
  - name: activation.services.get_detail
    type: (ActivationInfo, list[TransferInfo])
    desc: TransferInfo 字段 old_device_hash、old_device_info、new_device_hash、new_device_info、new_ip（新设备激活 IP，旧记录为 None）、penalty_hours、expires_before、expires_after、created_at；新记录在前
  - name: activation.services.toggle_disabled
    type: ActivationInfo
    desc: 切换后的激活记录
  - name: activation.services.count_in_use_by_product
    type: dict[str, int]
    desc: product 标识 → 使用中的激活记录数；没有使用中记录的 product 不出现
  - name: activation.services.delete_by_product
    type: int
    desc: 删除的激活记录数
contract:
  - 激活、校验与 MCP 接口均无需登录
  - MCP 的 GET 请求返回 405
  - MCP 只有一个只读工具 get_activation_guide：返回按当前请求生成的服务地址、激活与校验完整地址、docs/client/activation 与 docs/client/fingerprint 全文，以及本 interface.yaml 中 POST /api/activate、POST /api/verify 的 input、output 与全部 errors；不含其它 input、output 与 contract
  - get_activation_guide 每次调用时读取上述文件，文件修改后下一次调用即返回新内容，无需重启
  - 本 Module 返回的所有错误码都列在 errors 中
  - 激活先按卡密查激活记录：首次激活由卡密批次反查 product，已有激活记录用记录上的 product_code，再检查 product 未禁用
  - 已有激活记录：只依据激活记录判定（未禁用、未到期），不再检查卡密批次与校验码
  - 无激活记录（首次激活）：卡密须经 server/keys 验证通过（批次存在、序号在批次数量内、校验码有效、批次未禁用），product 取卡密所属批次，且 product 类型须为 device
  - 未激活的卡密不过期
  - 激活 IP 取请求的 REMOTE_ADDR（代理头由 server 统一处理）；只供查看，不参与判定
  - 首次激活：写入激活记录（含激活 IP），到期时间 = 当前时间 + 卡密所属批次的有效时长；不写换设备记录
  - 同设备再次激活：签发新 token，不扣减、不重新计时、不写换设备记录、不更新激活 IP
  - 新设备激活且 product 不允许换设备：拒绝
  - 新设备激活且 product 允许换设备：扣减后到期时间早于当前时间则拒绝且不改动；否则在同一事务内替换激活记录（设备与激活 IP）、提前到期时间、追加换设备记录（含新设备激活 IP）
  - 校验：token 签名有效，token 中的 product 存在且未禁用，激活记录未禁用、未到期，且 token 中的 device_hash 与当前激活记录一致
  - token 使用服务端密钥签名，客户端无法伪造
  - 每个卡密最多一条激活记录；激活记录与换设备记录只能经本 Module 读写
  - 激活记录只由激活流程写入与更新，对外只能切换禁用状态；换设备记录只追加；两者只能经 delete_by_product 按 product 整体删除（同一事务内）
depends:
  - server/keys
errors:
  - code: REQUEST_INVALID
    desc: 请求参数缺失或格式错误
  - code: PRODUCT_DISABLED
    desc: product 已禁用
  - code: BATCH_DISABLED
    desc: 卡密批次已被禁用，不能用于新激活
  - code: CODE_INVALID
    desc: 卡密格式错误、所属批次不存在、序号超出批次数量或校验码无效
  - code: CODE_TYPE_MISMATCH
    desc: 卡密属于按次数 product，不能用于设备激活
  - code: CODE_DISABLED
    desc: 卡密的激活记录已被管理员禁用
  - code: CODE_EXPIRED
    desc: 卡密激活后已到期
  - code: TRANSFER_NOT_ALLOWED
    desc: product 不允许换设备，新设备激活被拒绝
  - code: TRANSFER_INSUFFICIENT_TIME
    desc: 扣减后剩余时长不足，换设备被拒绝
  - code: DEVICE_MISMATCH
    desc: 校验时设备与当前激活记录不一致
  - code: TOKEN_INVALID
    desc: token 签名或内容无效
  - code: ACTIVATION_NOT_FOUND
    desc: 激活记录不存在
tests:
  - 首次激活写入到期时间与激活 IP 且无换设备记录
  - 同设备再次激活到期时间与激活 IP 不变；换设备后激活 IP 为新请求的 IP，换设备记录的 new_ip 相同
  - 不允许换设备时新设备返回 TRANSFER_NOT_ALLOWED
  - 允许换设备时到期时间按扣减时长提前，并追加一条完整换设备记录
  - 剩余时长不足时返回 TRANSFER_INSUFFICIENT_TIME，激活记录与到期时间不变
  - 换设备后旧设备 token 校验返回 DEVICE_MISMATCH
  - 篡改 token 返回 TOKEN_INVALID
  - 接口参数缺失返回 REQUEST_INVALID
  - 卡密批次禁用后同批次卡密首次激活返回 BATCH_DISABLED，已激活记录仍可换设备与校验
  - 伪造或篡改的卡密返回 CODE_INVALID；按次数 product 的卡密返回 CODE_TYPE_MISMATCH 且不写激活记录
  - 激活记录被禁用返回 CODE_DISABLED；到期后返回 CODE_EXPIRED
  - count_by_product 按 product 统计；search 只返回该 product 的记录，可按带连字符的卡密、设备信息搜索
  - get_detail 返回换设备记录；toggle_disabled 往返切换；不存在的记录返回 ACTIVATION_NOT_FOUND
  - count_in_use_by_product 只统计未禁用且未到期的激活记录；delete_by_product 删除该 product 的激活记录与换设备记录，不影响其它 product
  - MCP initialize、tools/list 正常；get_activation_guide 返回的地址与请求域名一致，代理声明 https 时为 https
  - get_activation_guide 包含激活与校验接口及全部错误码，不含 activation.services 接口与 product_code
  - 修改接入规范与 interface.yaml 后不重启，get_activation_guide 下一次调用即返回新内容
  - 本 Module 返回的错误码都列在 errors 中
  - MCP 未知方法返回 JSON-RPC 错误；通知返回 202；GET 返回 405

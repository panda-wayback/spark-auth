name: activation
function: 卡密签名验证、激活判定、计时与换设备扣减、token 签发与校验、客户端接口、只读 MCP 接入说明
modules: []
input:
  - name: POST /api/activate
    type: JSON {product, code, device_hash, device_info?}
    desc: product 为软件标识；code 为用户输入的卡密；device_hash 为 64 位小写十六进制设备指纹哈希；device_info 为可选的可读设备信息，不超过 255 个字符
  - name: POST /api/verify
    type: JSON {product, device_hash, token}
    desc: token 为激活时签发的 token
  - name: POST /mcp
    type: JSON-RPC 2.0 消息
    desc: MCP Streamable HTTP（无状态）；方法 initialize、ping、tools/list、tools/call
output:
  - name: POST /api/activate
    type: JSON {ok:true, token, expires_at}
    desc: token 绑定 product、code、device_hash；expires_at 为 ISO 8601 到期时间
  - name: POST /api/verify
    type: JSON {ok:true, valid:true, expires_at}
    desc: expires_at 为 ISO 8601 到期时间
  - name: POST /api/activate、POST /api/verify 失败
    type: JSON {ok:false, error:{code, message}}
    desc: REQUEST_INVALID 为 400，PRODUCT_NOT_FOUND 与 SIGNING_KEY_NOT_FOUND 为 404，其余为 403
  - name: POST /mcp
    type: JSON-RPC 2.0 响应
    desc: 直接返回 JSON；通知返回 202
contract:
  - 激活、校验与 MCP 接口均无需登录
  - MCP 的 GET 请求返回 405
  - MCP 只有一个只读工具 get_activation_guide：返回按当前请求生成的服务地址、激活与校验完整地址，以及 docs/client/activation、docs/client/fingerprint 与本 interface.yaml 全文
  - 激活先检查 product 存在且未禁用，再按卡密查激活记录
  - 已有激活记录：只依据激活记录判定（属于该 product、未禁用、未到期），不再检查私钥批次与签名
  - 无激活记录（首次激活）：按卡密携带的批次标识找到私钥批次，批次须存在且未禁用，签名须有效，卡密内 product 须与上报一致
  - 未激活的卡密不过期
  - 首次激活：写入激活记录，到期时间 = 当前时间 + 卡密内有效时长；不写换设备记录
  - 同设备再次激活：签发新 token，不扣减、不重新计时、不写换设备记录
  - 新设备激活且 product 不允许换设备：拒绝
  - 新设备激活且 product 允许换设备：扣减后到期时间早于当前时间则拒绝且不改动；否则在同一事务内替换激活记录、提前到期时间、追加换设备记录
  - 校验：token 签名有效，product 存在且未禁用，激活记录未禁用、未到期，且 token 中的 device_hash 与当前激活记录一致
  - token 使用服务端密钥签名，客户端无法伪造
depends:
  - server/keys
errors:
  - code: REQUEST_INVALID
    desc: 请求参数缺失或格式错误
  - code: PRODUCT_NOT_FOUND
    desc: product 不存在
  - code: PRODUCT_DISABLED
    desc: product 已禁用
  - code: SIGNING_KEY_NOT_FOUND
    desc: 卡密携带的私钥批次不存在
  - code: SIGNING_KEY_DISABLED
    desc: 私钥批次已被禁用，不能用于新激活
  - code: CODE_INVALID
    desc: 卡密签名无效或格式错误
  - code: CODE_DISABLED
    desc: 卡密的激活记录已被管理员禁用
  - code: CODE_EXPIRED
    desc: 卡密激活后已到期
  - code: CODE_PRODUCT_MISMATCH
    desc: 卡密不属于客户端上报的 product
  - code: TRANSFER_NOT_ALLOWED
    desc: product 不允许换设备，新设备激活被拒绝
  - code: TRANSFER_INSUFFICIENT_TIME
    desc: 扣减后剩余时长不足，换设备被拒绝
  - code: DEVICE_MISMATCH
    desc: 校验时设备与当前激活记录不一致
  - code: TOKEN_INVALID
    desc: token 签名或内容无效
tests:
  - 首次激活写入到期时间且无换设备记录
  - 同设备再次激活到期时间不变
  - 不允许换设备时新设备返回 TRANSFER_NOT_ALLOWED
  - 允许换设备时到期时间按扣减时长提前，并追加一条完整换设备记录
  - 剩余时长不足时返回 TRANSFER_INSUFFICIENT_TIME，激活记录与到期时间不变
  - 换设备后旧设备 token 校验返回 DEVICE_MISMATCH
  - 篡改 token 返回 TOKEN_INVALID
  - 接口参数缺失返回 REQUEST_INVALID
  - 私钥批次禁用后同批次卡密首次激活被拒绝，已激活记录仍可换设备与校验
  - 伪造或篡改的卡密返回 CODE_INVALID；其它软件的卡密返回 CODE_PRODUCT_MISMATCH
  - 激活记录被禁用返回 CODE_DISABLED
  - MCP initialize、tools/list 正常；get_activation_guide 返回的地址与请求域名一致，代理声明 https 时为 https
  - MCP 未知方法返回 JSON-RPC 错误；通知返回 202；GET 返回 405

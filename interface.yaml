name: spark-auth
function: 按软件管理自包含卡密，将已激活卡密绑定到单台设备，并支持按次数卡密核销的授权服务端
modules:
  - path: server
    function: Django 服务端：product 与卡密批次、卡密激活与校验、按次数卡密核销、管理后台
input: []
output: []
contract:
  - 一个卡密同一时刻只绑定一台设备
  - 卡密有效时长从首次激活开始计算，未激活的卡密不过期
  - 换设备策略由卡密所属 product 决定
  - 接入方只提交卡密，不提交 product；product 由卡密所属批次在服务端确定
  - product 分设备激活与按次数两种：设备激活卡密只能激活；按次数卡密只能核销，可查剩余、一次可扣多次，次数在签发批次时指定，用完或超用作废
  - 客户端不在本仓库实现，接入方按 docs/client 规范调用 server/activation 与 server/redeem 接口
  - 本机 make run 一条命令即可运行（自动建虚拟环境、安装依赖、迁移）；Docker 镜像只需挂载数据卷即可运行，并内置健康检查
depends: []
errors: []
tests:
  - Integration Test：模拟接入方通过 HTTP 调用，在后台创建 product 与签发卡密后激活成功、校验通过
  - Integration Test：登录后台批量签发卡密并导出 CSV，模拟接入方激活其中一个卡密成功
  - Integration Test：不允许换设备的 product，第二台设备激活被拒绝
  - Integration Test：允许换设备且扣 1 天的 product，换设备后到期时间提前 1 天、新增一条换设备记录、旧设备校验失败
  - Integration Test：剩余时长不足扣减时换设备被拒绝，原设备仍可用
  - Integration Test：已过期卡密被拒绝
  - Integration Test：禁用卡密批次后，同批次卡密首次激活被拒绝，但已激活设备仍可校验
  - Integration Test：后台创建按次数软件并签发可用 2 次的卡密，模拟接入方通过 HTTP 核销两次成功（剩余 1、0），第三次被拒绝，用该卡密激活被拒绝

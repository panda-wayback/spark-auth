services:
  spark-auth:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPARK_AUTH_SECRET_KEY: ${SPARK_AUTH_SECRET_KEY:?请在 .env 中设置 SPARK_AUTH_SECRET_KEY}
      SPARK_AUTH_DB_PATH: /host-server/db.sqlite3
      SPARK_AUTH_ADMIN_USERNAME: ${SPARK_AUTH_ADMIN_USERNAME:-}
      SPARK_AUTH_ADMIN_PASSWORD: ${SPARK_AUTH_ADMIN_PASSWORD:-}
    volumes:
      - ./server:/host-server
